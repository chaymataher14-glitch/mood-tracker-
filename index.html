<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Canvas — Crystal Edition</title>
    
    <!-- Branding for System & Installation -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-font-smoothing: antialiased;
        }

        /* The Grid System */
        .canvas-grid {
            display: grid;
            grid-template-rows: repeat(7, 1fr);
            grid-auto-flow: column;
            gap: 6px;
        }

        .day-pixel {
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            aspect-ratio: 1/1;
        }
        .day-pixel:hover {
            transform: scale(1.3);
            z-index: 50;
            border-radius: 6px !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Refined Tooltip */
        .tooltip { 
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 140%;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 100;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.05));
        }
        .day-pixel:hover .tooltip { 
            visibility: visible; 
            opacity: 1; 
            transform: translateX(-50%) translateY(0); 
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 10px; }

        input[type="range"] { 
            appearance: none;
            height: 4px;
            background: #f1f5f9;
            border-radius: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #000;
            border: 2px solid white;
            cursor: pointer;
        }

        .fade-in { animation: fadeIn 0.8s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-[#fafaf9]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const THEMES = {
            pure: { id: 'pure', name: 'Pure', bg: 'bg-[#fafafa]', card: 'bg-white', border: 'border-slate-100', accent: '#64748b' },
            clay: { id: 'clay', name: 'Clay', bg: 'bg-[#f7f5f2]', card: 'bg-white', border: 'border-stone-100', accent: '#a8a29e' },
            wave: { id: 'wave', name: 'Wave', bg: 'bg-[#f2f5f7]', card: 'bg-white', border: 'border-blue-100/50', accent: '#93c5fd' },
            forest: { id: 'forest', name: 'Forest', bg: 'bg-[#f4f7f4]', card: 'bg-white', border: 'border-emerald-100/50', accent: '#6ee7b7' }
        };

        const blendColors = (breakdown, moods) => {
            if (!breakdown || breakdown.length === 0) return '#f1f5f9';
            let r = 0, g = 0, b = 0, total = 0;
            breakdown.forEach(item => {
                const config = moods.find(m => m.id === item.id);
                if (config && item.percent > 0) {
                    const hex = config.color.replace('#', '');
                    const weight = item.percent / 100;
                    r += Math.pow(parseInt(hex.substring(0, 2), 16), 2) * weight;
                    g += Math.pow(parseInt(hex.substring(2, 4), 16), 2) * weight;
                    b += Math.pow(parseInt(hex.substring(4, 6), 16), 2) * weight;
                    total += weight;
                }
            });
            if (total === 0) return '#f1f5f9';
            const toHex = (n) => Math.round(Math.sqrt(n / (total || 1))).toString(16).padStart(2, '0');
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
        };

        const App = () => {
            const [view, setView] = useState('month');
            const [themeKey, setThemeKey] = useState(() => localStorage.getItem('mc_v10_theme') || 'pure');
            const [moods, setMoods] = useState(() => {
                const saved = localStorage.getItem('mc_v10_moods');
                return saved ? JSON.parse(saved) : [
                    { id: '1', label: 'Radiant', color: '#fef3c7' },
                    { id: '2', label: 'Calm', color: '#dbeafe' },
                    { id: '3', label: 'Inspired', color: '#dcfce7' }
                ];
            });
            const [entries, setEntries] = useState(() => {
                const saved = localStorage.getItem('mc_v10_entries');
                return saved ? JSON.parse(saved) : {};
            });

            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [newMoodName, setNewMoodName] = useState('');
            const chartInstance = useRef(null);
            const t = THEMES[themeKey] || THEMES.pure;

            useEffect(() => {
                localStorage.setItem('mc_v10_moods', JSON.stringify(moods));
                localStorage.setItem('mc_v10_entries', JSON.stringify(entries));
                localStorage.setItem('mc_v10_theme', themeKey);
                document.body.className = `${t.bg}`;
            }, [moods, entries, themeKey, t]);

            const stats = useMemo(() => {
                const now = new Date();
                const periodEntries = Object.entries(entries).filter(([date]) => {
                    const d = new Date(date);
                    if (view === 'week') return (now - d) / 86400000 <= 7;
                    if (view === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                    return d.getFullYear() === now.getFullYear();
                });
                const totals = {};
                moods.forEach(m => totals[m.id] = 0);
                periodEntries.forEach(([_, data]) => {
                    data.breakdown.forEach(b => { if (totals.hasOwnProperty(b.id)) totals[b.id] += b.percent; });
                });
                const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
                const dominant = moods.find(m => m.id === sorted[0]?.[0]);
                const hasData = periodEntries.length > 0 && sorted[0][1] > 0;

                return {
                    label: hasData ? dominant.label : "Neutral",
                    color: hasData ? dominant.color : "#cbd5e1",
                    coverage: periodEntries.length,
                    chartData: {
                        labels: moods.map(m => m.label),
                        datasets: [{
                            data: moods.map(m => totals[m.id]),
                            backgroundColor: moods.map(m => m.color),
                            borderWidth: 0,
                            borderRadius: 8
                        }]
                    }
                };
            }, [entries, moods, view]);

            useEffect(() => {
                const ctx = document.getElementById('mainChart');
                if (!ctx) return;
                if (chartInstance.current) chartInstance.current.destroy();
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: stats.chartData,
                    options: { cutout: '88%', maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            }, [stats]);

            return (
                <div className={`min-h-screen flex flex-col fade-in`}>
                    {/* NAV */}
                    <nav className={`fixed top-0 w-full z-[100] border-b ${t.border} bg-white/60 backdrop-blur-xl px-10 py-5 flex items-center justify-between`}>
                        <div className="text-[10px] font-black uppercase tracking-[0.5em] opacity-40">Mood Canvas</div>
                        <div className="flex items-center gap-8">
                            <div className="flex bg-slate-100/50 p-1 rounded-xl">
                                {['week', 'month', 'year'].map(v => (
                                    <button 
                                        key={v} onClick={() => setView(v)}
                                        className={`px-5 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest transition-all ${view === v ? 'bg-white shadow-sm text-slate-900' : 'text-slate-400'}`}
                                    >
                                        {v}
                                    </button>
                                ))}
                            </div>
                            <select 
                                value={themeKey} onChange={(e) => setThemeKey(e.target.value)}
                                className="bg-transparent text-[9px] font-black uppercase tracking-[0.2em] outline-none border-b border-slate-200 pb-0.5"
                            >
                                {Object.values(THEMES).map(theme => <option key={theme.id} value={theme.id}>{theme.name}</option>)}
                            </select>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto w-full mt-36 px-10 grid grid-cols-1 lg:grid-cols-12 gap-12 pb-24">
                        {/* CANVAS SECTION */}
                        <div className="lg:col-span-8">
                            <div className={`${t.card} p-12 rounded-[4rem] border ${t.border} shadow-[0_20px_50px_rgba(0,0,0,0.02)]`}>
                                <div className="flex justify-between items-center mb-14">
                                    <div>
                                        <h2 className="text-[10px] font-black uppercase tracking-[0.4em] opacity-20 mb-1">Grid View</h2>
                                        <p className="text-xs font-medium opacity-40 italic">Hover to reveal the breakdown</p>
                                    </div>
                                    <button onClick={() => setIsModalOpen(true)} className="bg-slate-900 text-white px-8 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:opacity-80 transition shadow-xl">
                                        + Record Today
                                    </button>
                                </div>
                                
                                <div className={`${view === 'year' ? 'canvas-grid h-48' : 'flex flex-wrap gap-4'}`}>
                                    {Array.from({ length: view === 'year' ? 364 : (view === 'month' ? 30 : 7) }).map((_, i) => {
                                        const d = new Date(); d.setDate(d.getDate() - i);
                                        const dateStr = d.toISOString().split('T')[0];
                                        const entry = entries[dateStr];
                                        const color = blendColors(entry?.breakdown, moods);

                                        return (
                                            <div key={i} className="group relative day-pixel h-full bg-slate-50 rounded-xl" style={{ backgroundColor: color }}>
                                                <div className="w-full h-full cursor-pointer" onClick={() => { setSelectedDate(dateStr); setIsModalOpen(true); }} />
                                                {entry && (
                                                    <div className="tooltip w-64 p-6 bg-white border border-slate-100 text-slate-800 rounded-[2.5rem] shadow-2xl text-[11px]">
                                                        <p className="font-bold opacity-20 uppercase tracking-widest mb-4">{dateStr}</p>
                                                        <div className="space-y-2">
                                                            {entry.breakdown.filter(b => b.percent > 0).map(b => (
                                                                <div key={b.id} className="flex justify-between font-bold">
                                                                    <span className="opacity-40">{moods.find(m => m.id === b.id)?.label}</span>
                                                                    <span>{b.percent}%</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                        {entry.reason && <p className="mt-5 pt-5 border-t border-slate-50 italic text-slate-400 leading-relaxed font-medium">"{entry.reason}"</p>}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {/* ANALYTICS SECTION */}
                        <div className="lg:col-span-4 space-y-10">
                            <div className={`${t.card} p-12 rounded-[4rem] border ${t.border} shadow-[0_20px_50px_rgba(0,0,0,0.02)]`}>
                                <h3 className="text-[9px] font-black uppercase tracking-[0.4em] opacity-20 mb-10">Report</h3>
                                <div className="mb-12 text-center">
                                    <p className="text-[10px] font-bold opacity-30 mb-2 italic">The dominant mood this {view} is:</p>
                                    <p className="text-4xl font-black tracking-tighter" style={{ color: stats.color }}>{stats.label}</p>
                                    <p className="text-[9px] font-bold mt-4 opacity-20 uppercase tracking-widest">{stats.coverage} days recorded</p>
                                </div>
                                <div className="w-full h-56 relative"><canvas id="mainChart"></canvas></div>
                            </div>

                            <div className={`${t.card} p-12 rounded-[4rem] border ${t.border} shadow-[0_20px_50px_rgba(0,0,0,0.02)]`}>
                                <h3 className="text-[9px] font-black uppercase tracking-[0.4em] opacity-20 mb-10">Spectrum</h3>
                                <div className="space-y-4 max-h-52 overflow-y-auto pr-2 custom-scrollbar">
                                    {moods.map((mood) => (
                                        <div key={mood.id} className="flex items-center gap-5">
                                            <input 
                                                type="color" value={mood.color}
                                                onChange={(e) => setMoods(moods.map(m => m.id === mood.id ? {...m, color: e.target.value} : m))}
                                                className="w-5 h-5 rounded-full cursor-pointer bg-transparent border-none p-0 ring-4 ring-white shadow-sm"
                                            />
                                            <span className="flex-1 text-[11px] font-bold opacity-40 lowercase italic">{mood.label}</span>
                                            <button onClick={() => setMoods(moods.filter(m => m.id !== mood.id))} className="text-slate-200 hover:text-red-300 transition-colors">&times;</button>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-10 pt-8 border-t border-slate-50 flex gap-2">
                                    <input 
                                        type="text" value={newMoodName} 
                                        onChange={(e) => setNewMoodName(e.target.value)}
                                        placeholder="Mood tag..."
                                        className="flex-1 bg-slate-50 rounded-xl px-4 py-2 text-[10px] font-bold uppercase tracking-widest outline-none"
                                    />
                                    <button onClick={() => { if(newMoodName) setMoods([...moods, {id: Date.now().toString(), label: newMoodName, color: '#f1f5f9'}]); setNewMoodName(''); }} className="bg-slate-900 text-white px-4 py-2 rounded-xl font-bold text-xs">+</button>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="mt-auto py-12 text-center opacity-20 hover:opacity-100 transition-opacity">
                        <p className="text-[10px] font-black uppercase tracking-[0.8em]">made by <span className="text-slate-900 lowercase italic tracking-tighter text-sm">shay✨</span></p>
                    </footer>

                    {/* LOG MODAL */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-100/40 backdrop-blur-3xl flex items-center justify-center p-6 z-[200]">
                            <div className="bg-white rounded-[4.5rem] w-full max-w-xl p-16 shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scrollbar border border-slate-100">
                                <button onClick={() => setIsModalOpen(false)} className="absolute top-14 right-14 text-slate-300 hover:text-slate-900 text-4xl font-light transition-colors">&times;</button>
                                <h2 className="text-4xl font-black tracking-tighter mb-2">Record Day</h2>
                                <p className="text-[10px] font-bold uppercase tracking-[0.5em] opacity-10 mb-14">{selectedDate}</p>
                                
                                <div className="space-y-10">
                                    {moods.map(mood => {
                                        const entry = entries[selectedDate]?.breakdown?.find(b => b.id === mood.id) || { percent: 0 };
                                        return (
                                            <div key={mood.id} className="space-y-4">
                                                <div className="flex justify-between items-center text-[10px] font-black uppercase tracking-[0.2em] opacity-40">
                                                    <span className="flex items-center gap-3">
                                                        <div className="w-2.5 h-2.5 rounded-full" style={{backgroundColor: mood.color}}></div>
                                                        {mood.label}
                                                    </span>
                                                    <span>{entry.percent}%</span>
                                                </div>
                                                <input 
                                                    type="range" className="w-full" value={entry.percent}
                                                    onChange={(e) => {
                                                        const val = parseInt(e.target.value);
                                                        const current = entries[selectedDate] || { breakdown: [], reason: '' };
                                                        const others = current.breakdown.filter(b => b.id !== mood.id);
                                                        setEntries({...entries, [selectedDate]: {...current, breakdown: [...others, {id: mood.id, percent: val}]}});
                                                    }}
                                                />
                                            </div>
                                        );
                                    })}
                                    
                                    <div className="pt-6 border-t border-slate-50">
                                        <textarea 
                                            className="w-full bg-slate-50 border-none p-8 rounded-[3rem] h-32 outline-none text-sm font-medium italic text-slate-500 focus:ring-1 focus:ring-slate-100"
                                            placeholder="What defined your inner peace today?"
                                            value={entries[selectedDate]?.reason || ''}
                                            onChange={(e) => setEntries({...entries, [selectedDate]: { ...entries[selectedDate], reason: e.target.value }})}
                                        />
                                    </div>
                                    
                                    <button onClick={() => setIsModalOpen(false)} className="w-full py-6 bg-slate-900 text-white rounded-[2.5rem] font-bold text-[11px] uppercase tracking-[0.3em] hover:bg-slate-800 transition-all shadow-2xl">
                                        Finalize Entry
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
